<div id="demoArea">
  <div class="demo-editors">
    <div class="editor-pane"><div class="pane-heading"><label for="oritext">Original text</label><span>日本語 · up to 5,000 characters</span></div><textarea id="oritext" lang="ja" rows="5" maxlength="5000" spellcheck="false">感じ取れたら手を繋ごう、重なるのは人生のライン and レミリア最高！</textarea></div>
    <div class="editor-pane result-pane"><div class="pane-heading"><span id="outputLabel">Your reading</span><span>CONVERTED OUTPUT</span></div><div id="output" role="region" aria-labelledby="outputLabel" aria-live="polite"></div></div>
  </div>
  <div class="demo-toolbar"><div class="demo-options">
    <div><label for="to">To</label><select id="to"><option value="hiragana">Hiragana</option><option value="katakana">Katakana</option><option value="romaji">Romaji</option></select></div>
    <div><label for="mode">Mode</label><select id="mode"><option value="normal">Normal</option><option value="spaced">Spaced</option><option value="okurigana">Okurigana</option><option value="furigana">Furigana</option></select></div>

</div>
