{% if jekyll.environment == 'production' and site.google_analytics_id %}
<script>
  // Keep local previews and downloaded build artifacts out of production statistics.
  if (window.location.hostname === 'kuroshiro.org' || window.location.hostname === 'www.kuroshiro.org') {
    (function () {
      var measurementId = {{ site.google_analytics_id | jsonify }};
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', measurementId);
      var tag = document.createElement('script');
      tag.async = true;
      tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
      document.head.appendChild(tag);
    })();
  }
</script>
{% endif %}
