name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Check out typed Kuromoji analyzer
        uses: actions/checkout@v7
        with:
          repository: hexenq/kuroshiro-analyzer-kuromoji
          ref: 2c8bf3b6107c5cc5e067e015e63ffdbcec596a19
          path: tmp/kuromoji
          persist-credentials: false

      - name: Build paired analyzer
        run: |
          npm ci --prefix tmp/kuromoji
          npm run build --prefix tmp/kuromoji

      - name: Check typed consumers of both packed packages
        run: npm run test:types
        env:
          KUROSHIRO_ANALYZER_PACKAGE: tmp/kuromoji
